# 页面元素选择器配置
# Clobus.uz 1C Enterprise

# 登录相关配置
login:
  url: "/a/acc314/53211/en/"
  username_input: "input[name='openid.auth.user'], input#userName"
  password_input: "input[name='openid.auth.pwd'], input#userPassword"
  submit_button: "input#submit_btn, input.enterButton"
  success_indicator: "#captionbar"

# 客户模块
customers:
  list_url: "/a/acc314/53211/en/e1cib/app/DataProcessor.Партнеры.ListForm"
  table: "table.dataGrid"
  row: "tbody tr"
  columns:
    code: "td:nth-child(1)"
    name: "td:nth-child(2)"
    inn: "td:nth-child(3)"
    phone: "td:nth-child(4)"
    address: "td:nth-child(5)"

# 产品模块
products:
  list_url: "/a/acc314/53211/en/e1cib/app/Catalog.Номенклатура.ListForm"
  table: "table.dataGrid"
  row: "tbody tr"
  columns:
    sku: "td:nth-child(1)"
    name: "td:nth-child(2)"
    unit: "td:nth-child(3)"
    price: "td:nth-child(4)"

# 订单模块
orders:
  list_url: "/a/acc314/53211/en/e1cib/app/Document.ЗаказКлиента.ListForm"
  table: "table.dataGrid"
  row: "tbody tr"
  columns:
    number: "td:nth-child(1)"
    date: "td:nth-child(2)"
    customer: "td:nth-child(3)"
    amount: "td:nth-child(4)"
    status: "td:nth-child(5)"

# 通用
common:
  preloader: "#pages_preloader"
  next_button: "button[title*='следующ']"
